name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix build -L
      - run: nix develop -c cargo clippy --all-targets -- -D warnings
      - run: nix develop -c cargo fmt -- --check
