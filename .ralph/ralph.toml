[workspace]
version = "1.0"
default_backend = "claude"

[backends.claude]
command = "claude"
args = ["--dangerously-skip-permissions"]
timeout_seconds = 600

[backends.claude.env]

[backends.codex]
command = "/home/master/bin/codex"
args = ["exec"]
timeout_seconds = 600

[backends.codex.env]

[workflow]
max_review_iterations = 5
auto_commit = true
commit_message_style = "conventional"
commit_tag_format = "ralph/{project_id}/loop-{loop_number}"
prompt_change_action = "abort"

[templates]
planner = "templates/planner.md"
implementer = "templates/implementer.md"
reviewer = "templates/reviewer.md"
completer = "templates/completer.md"

[git]
auto_branch = true
branch_format = "ralph/{project_id}"
sign_commits = false
base_branch = "master"
