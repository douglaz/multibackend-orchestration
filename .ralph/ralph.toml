[workspace]
version = "1.0"
default_backend = "claude"

[backends.claude]
command = "claude"
args = ["-p", "--permission-mode", "acceptEdits", "--allowedTools", "Bash,Edit,Write,Read,Glob,Grep,WebSearch,WebFetch,Task,TaskOutput,TaskStop"]
timeout_seconds = 7200

[backends.claude.env]


[backends.codex]
command = "/root/.npm-global/bin/codex"
args = [
    "exec",
    "--dangerously-bypass-approvals-and-sandbox",
    "-",
]
timeout_seconds = 7200

[backends.codex.env]


[workflow]
max_review_iterations = 30
auto_commit = true
commit_message_style = "conventional"
commit_tag_format = "ralph/{project_id}/loop-{loop_number}"
prompt_change_action = "abort"

[templates]
planner = "templates/planner.md"
implementer = "templates/implementer.md"
reviewer = "templates/reviewer.md"
completer = "templates/completer.md"

[git]
auto_branch = true
branch_format = "ralph/{project_id}"
sign_commits = false
base_branch = "master"
