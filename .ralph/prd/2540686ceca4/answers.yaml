api_compatibility_layer: Exact field-for-field compatibility
assumeutxo_support: Defer to post-1.0
assumevalid_strategy: Yes, implement assumevalid
async_runtime: tokio
ci_infrastructure: Both (fast checks on GHA, full suite self-hosted)
config_file_format: TOML primary, bitcoin.conf compatibility layer
core_version_tracking_strategy: Track tagged releases, update periodically
crate_workspace_structure: Cargo workspace with separate crates
funding_and_team: self funded until PoC
historical_consensus_bugs: yes
index_support_scope: txindex and blockfilterindex only
libbitcoinkernel_fallback: Skip to pure Rust consensus
license_choice: MIT
mainnet_goal: Production mainnet node
minimum_rust_version_policy: Latest stable only
nostd_consensus: Nice-to-have, design for it but don't enforce
observability_and_metrics: Structured tracing/logging only
p2p_protocol_version: Modern only (v70016+)
parallel_verification_strategy: rayon for validation, tokio for I/O (hybrid)
platform_targets: Linux x86_64 primary; macOS and Linux aarch64 as secondary targets
policy_compatibility: Exact policy replication
project_name: rust-bitcoind
regtest_support: yes
reindex_support: no
rest_interface: Defer to post-1.0
rpc_coverage_target: Full RPC parity (all non-wallet RPCs)
rust_bitcoin_integration: Use rust-bitcoin primitives
rust_bitcoin_version_policy: Track latest stable release
secp256k1_initial_choice: Start with k256 (pure Rust), fall back to C if needed
secp256k1_pure_rust_evaluation: Evaluate k256 as alternative
security_disclosure_policy: Defer until mainnet-ready
solo_or_collaborative: Solo/small team initially
storage_abstraction_layer: Direct redb integration, refactor later if needed
storage_engine: redb (pure Rust, ACID)
target_core_version: Track latest master
test_execution_strategy: Fork and minimally adapt
test_suite_wallet_rpc_handling: Implement generatetoaddress/mining RPCs without full wallet
testnet_signet_support: Regtest only for now, add others later
timeline_expectations: no, take our time
versioning_scheme: SemVer (independent)
zmq_implementation: Defer/skip ZMQ entirely
